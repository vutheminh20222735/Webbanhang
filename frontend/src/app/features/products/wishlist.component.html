<div class="wishlist-container">
  <h1>Sản phẩm yêu thích</h1>

  <div class="message" [class.success]="messageType === 'success'" [class.error]="messageType === 'error'" *ngIf="message">
    {{ message }}
  </div>

  <div class="wishlist-toolbar" *ngIf="wishlistItems.length > 0">
    <span class="count">{{ wishlistItems.length }} sản phẩm</span>
    <button class="btn-danger" type="button" (click)="clearWishlist()">Xóa toàn bộ</button>
  </div>

  <div class="wishlist-grid" *ngIf="wishlistItems.length > 0">
    <app-product-card *ngFor="let item of wishlistItems" [product]="item"></app-product-card>
  </div>

  <div class="empty-state" *ngIf="wishlistItems.length === 0">
    <p class="empty-icon">♡</p>
    <p class="empty-text">Danh sách yêu thích của bạn trống.</p>
    <p class="empty-hint">Hãy thêm sản phẩm bạn thích để lưu lại!</p>
    <a routerLink="/" class="btn-primary">Khám phá sản phẩm</a>
  </div>
</div>
