<div class="product-card" [class.out]="outOfStock">
  <button
    type="button"
    class="wish-btn"
    [class.active]="wished"
    (click)="toggleWish($event)"
    [attr.aria-label]="wished ? 'Bỏ yêu thích' : 'Thêm yêu thích'"
  >{{ wished ? '♥' : '♡' }}</button>

  <a [routerLink]="['/product', product._id]" class="thumb">
    <span class="stock-badge" [class.soldout]="outOfStock">{{ outOfStock ? 'Hết hàng' : 'Còn hàng' }}</span>
    <img [src]="image" [alt]="product.name" />
  </a>

  <div class="info">
    <span class="brand">{{ product.brand }}</span>
    <a [routerLink]="['/product', product._id]" class="name">
      <h3>{{ product.name }}</h3>
    </a>
    <p class="spec" *ngIf="product.ram || product.storage">{{ product.ram }} <ng-container *ngIf="product.ram && product.storage">·</ng-container> {{ product.storage }}</p>
    <div class="price-row">
      <strong>{{ (product.salePrice || product.price) | number }}₫</strong>
      <s *ngIf="product.salePrice">{{ product.price | number }}₫</s>
      <span class="discount" *ngIf="discount">-{{ discount }}%</span>
    </div>
    <div class="card-actions">
      <a class="btn-outline btn-detail" [routerLink]="['/product', product._id]">Xem chi tiết</a>
      <button
        type="button"
        class="btn-cart"
        [disabled]="outOfStock || adding"
        (click)="addToCart($event)"
        [attr.aria-label]="added ? 'Đã thêm' : (outOfStock ? 'Hết hàng' : 'Thêm giỏ')"
        [title]="added ? 'Đã thêm' : (outOfStock ? 'Hết hàng' : 'Thêm giỏ')"
      >
        <span *ngIf="!added">🛒</span>
        <span *ngIf="added">✓</span>
      </button>
    </div>
  </div>
</div>
